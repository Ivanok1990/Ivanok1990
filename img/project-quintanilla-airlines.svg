<text x="30" y="70" class="fg sans xb" style="font-size:20px">Quintanilla Airlines</text>
<path d="M386.0 44 l12 -12 M389.0 32 h9 v9" fill="none" stroke="var(--muted)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="nudge"/>
<text x="30" y="98" class="soft sans" style="font-size:13.5px">Full stack airline reservation platform:</text>
<text x="30" y="118" class="soft sans" style="font-size:13.5px">flight search, bookings and admin.</text>
<text x="30" y="152" class="ac mono" style="font-size:12px">React · Node.js · Express · MySQL · Sequelize</text>
