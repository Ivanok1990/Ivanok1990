name: Update profile

# Refreshes the contribution data and rebuilds the bento panels.
# Runs daily, on pushes that touch the generators, and on demand.

"on":
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "data/icons.json"
      - ".github/workflows/update-profile.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch contribution calendar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_contributions.py ${{ github.repository_owner }} data/contributions.json

      - name: Build bento panels
        run: python scripts/bento.py data/contributions.json

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: refresh profile panels"
            git push
          fi
